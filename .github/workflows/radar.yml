name: Radar de Milhas

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min (horário UTC; o GitHub às vezes atrasa alguns minutos)
  workflow_dispatch:          # permite rodar na mão pelo botão "Run workflow"
    inputs:
      teste:
        description: "Mandar um ping de teste no Telegram"
        type: boolean
        default: false

permissions:
  contents: write             # o robô precisa disso para gravar o dados.json

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install --quiet feedparser requests

      - name: Varrer as fontes e avisar no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PING: ${{ inputs.teste }}
        run: python3 scripts/radar.py publish --dados dados.json --estado estado.json --hours 36

      - name: Publicar o resultado
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add dados.json estado.json
          if git diff --staged --quiet; then
            echo "nada mudou nesta rodada"
          else
            git commit -m "radar: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
